{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-9">

        <div class="card">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">
                    {{ mode }}員工資料
                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="row">

                        <!-- 員工編號 -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                員工編號 *
                            </label>

                            <input type="text" name="employee_no" class="form-control" required maxlength="20"
                                value="{{ employee['employee_no'] if employee else '' }}">

                        </div>


                        <!-- 中文姓名 -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                中文姓名 *
                            </label>

                            <input type="text" name="chinese_name" class="form-control" required maxlength="50"
                                value="{{ employee['chinese_name'] if employee else '' }}">

                        </div>


                        <!-- 英文姓名 -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                英文姓名 *
                            </label>

                            <input type="text" name="english_name" class="form-control" required maxlength="100"
                                value="{{ employee['english_name'] if employee else '' }}">

                        </div>


                        <!-- 部門 -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                所屬部門 *
                            </label>

                            <select name="department" class="form-select" required>

                                {% set departments = [
                                '資訊部',
                                '人資部',
                                '財務部',
                                '行銷部',
                                '業務部',
                                '客服部',
                                '研發部',
                                '法務部',
                                '設計部',
                                '行政部'
                                ] %}

                                <option value="">
                                    請選擇部門
                                </option>

                                {% for dept in departments %}

                                <option value="{{ dept }}" {% if employee and employee['department']==dept %} selected
                                    {% endif %}>
                                    {{ dept }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- 職稱 -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                職稱 *
                            </label>

                            <input type="text" name="position" class="form-control" required maxlength="50"
                                value="{{ employee['position'] if employee else '' }}">

                        </div>


                        <!-- Email -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                公司電子郵件 *
                            </label>

                            <input type="email" name="email" class="form-control" required
                                value="{{ employee['email'] if employee else '' }}">

                        </div>


                        <!-- 分機 -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                分機號碼 *
                            </label>

                            <input type="text" name="extension" class="form-control" required pattern="[0-9]{4}"
                                maxlength="4" placeholder="例如：1001"
                                value="{{ employee['extension'] if employee else '' }}">

                        </div>


                        <!-- 手機 -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                行動電話 *
                            </label>

                            <input type="tel" name="mobile" class="form-control" required pattern="09[0-9]{8}"
                                maxlength="10" placeholder="例如：0912345678"
                                value="{{ employee['mobile'] if employee else '' }}">

                        </div>


                        <!-- 辦公地點 -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                辦公地點 *
                            </label>

                            <select name="office_location" class="form-select" required>

                                {% set locations = [
                                '台北辦公室',
                                '新竹辦公室',
                                '台中辦公室',
                                '高雄辦公室'
                                ] %}

                                <option value="">
                                    請選擇辦公地點
                                </option>

                                {% for location in locations %}

                                <option value="{{ location }}" {% if employee and employee['office_location']==location
                                    %} selected {% endif %}>
                                    {{ location }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- 到職日期 -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                到職日期 *
                            </label>

                            <input type="date" name="hire_date" class="form-control" required
                                value="{{ employee['hire_date'] if employee else '' }}">

                        </div>


                        <!-- 狀態 -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                在職狀態 *
                            </label>

                            <select name="status" class="form-select" required>

                                <option value="">
                                    請選擇
                                </option>

                                {% for status in ['在職', '離職', '留職停薪'] %}

                                <option value="{{ status }}" {% if employee and employee['status']==status %} selected
                                    {% endif %}>
                                    {{ status }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>

                    </div>


                    <hr>

                    <div class="text-end">

                        <a href="{{ url_for('index') }}" class="btn btn-secondary">
                            取消
                        </a>

                        <button type="submit" class="btn btn-primary">
                            儲存資料
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
